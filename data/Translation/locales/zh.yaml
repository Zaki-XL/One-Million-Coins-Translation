meta:
  language: "zh"
  display_name: "简体中文"

branches:
  0:
    name: "双手"
    description: "徒手抓取金币的强化分支。提升基础抓取能力与甜点判定。"
  1:
    name: "铁锹"
    description: "使用铁锹挖掘金币的强化分支。大范围铲取大量金币。"
  2:
    name: "磁铁"
    description: "使用强力磁石吸附金币的强化分支。连续自动吸取周围金币。"
  3:
    name: "金币强化"
    description: "提升金币生成、价值与自动泵币效率的分支。"
  4:
    name: "敏捷行动"
    description: "提升移动速度、耐力与动作灵活性的分支。"
  5:
    name: "高效作业"
    description: "提升全工具冷却速度、充能与运作效率的分支。"
  6:
    name: "终极大师"
    description: "解锁各类终极被动效果与自动化能力的最高级分支。"

upgrades:
  PickupRadius:
    name: "收集范围"
    description: "可以收集更大范围内的金币。"
  ToolSpeed:
    name: "工具速度"
    description: "加快所有工具的作业循环速度。"
  ToolCapacity:
    name: "工具容量"
    description: "增加工具每次动作可移动与回收的金币数量。"
  ToolRange:
    name: "工具射程"
    description: "可以从更远的位置触及深处的金币。"
  DepositSpeed:
    name: "存入速度"
    description: "加快将携带的金币存入金库的速度。"
  MovementSpeed:
    name: "移动速度"
    description: "可以在金库内更迅速地移动。"
  CarryCapacity:
    name: "携带容量"
    description: "提升口袋及所有背包的金币携带上限。"

items:
  Shovel:
    name: "铁锹"
    description: "按住左键，在近距离快速铲取密集的金币。"
  Pouch:
    name: "钱袋"
    description: "携带容量+500，基础存入速度提升至3倍。探索更久，卸货更快。"
  TinyMagnet:
    name: "微型磁铁"
    description: "点击快速吸取12枚金币。按住可进行连续吸附。"
  CoinRake:
    name: "金币耙"
    description: "按住左键并走动以聚拢金币。移动中最多可回收16枚。"
  SpringBoots:
    name: "弹簧靴"
    description: "跳跃高度提升65%。作为被动装备，无需燃料与插槽。"
  MagneticBoots:
    name: "磁力靴"
    description: "只需走在金币上方，每0.5秒自动吸取周围最多6枚金币。"
  Magnet:
    name: "强力磁铁"
    description: "按住左键，从较远距离强力吸附表层金币。"
  Backpack:
    name: "背包"
    description: "携带容量+3,250。与钱袋结合最多可携带4,000枚金币。"
  QuickDump:
    name: "极速倾倒内衬"
    description: "在所有漏斗处的基础存入速度提升至8倍。"
  SprintSoles:
    name: "火箭鞋底"
    description: "移动速度提升25%。大幅缩短往返金库的时间。"
  RecallCoil:
    name: "虫洞线圈"
    description: "右键点击即使穿墙也能瞬间将部署中的真空手雷召回手中。"
  Singularity:
    name: "奇点吸引仪"
    description: "每秒3,000枚的回收速度与5米超广域吸力，清空最后散落的金币。"
  Vortex:
    name: "黄金绞盘"
    description: "左键将缆线射入矿脉，按住可一口气卷收大批金币。"
  GravityCoupler:
    name: "重力耦合器"
    description: "基础存入速度提升至600倍。在任何漏斗处均可瞬间完成入库。"
  CoinRailgun:
    name: "金币轨道枪"
    description: "点击或按住，每0.45秒沿直线贯穿回收90枚金币。"
  HydraulicCoupler:
    name: "液压耦合器"
    description: "基础存入速度提升至240倍。巨量金币也能极速入库。"
  DrillVac:
    name: "钻头真空吸尘器"
    description: "按住向下钻采金币：一边移动一边每脉冲回收100枚金币。"
  HopperPack:
    name: "漏斗背包"
    description: "携带容量+11,000。与之前所有背包结合最高可携带15,000枚。"

