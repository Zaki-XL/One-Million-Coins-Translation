meta:
  language: "ko"
  fonts: "Malgun Gothic Bold, Malgun Gothic, Gulim, Dotum, Yu Gothic UI Bold, Segoe UI Bold"
  display_name: "한국어"

branches:
  0:
    name: "맨손"
    description: "맨손으로 코인을 줍는 강화 분기입니다. 기본 수집력과 스위트 스폿 판정을 강화합니다."
  1:
    name: "삽"
    description: "삽으로 코인을 퍼내는 강화 분기입니다. 넓은 범위에서 대량의 코인을 수집합니다."
  2:
    name: "자석"
    description: "자석으로 코인을 끌어당기는 강화 분기입니다. 주변 코인을 지속적으로 자동 흡인합니다."
  3:
    name: "코인 강화"
    description: "코인 생성, 가치 및 자동 펌프 효율을 높이는 분기입니다."
  4:
    name: "민첩성"
    description: "이동 속도, 스태미나 및 동작 유연성을 높이는 분기입니다."
  5:
    name: "고효율"
    description: "모든 도구의 쿨다운, 충전 속도 및 작업 효율을 높이는 분기입니다."
  6:
    name: "궁극 숙련"
    description: "다양한 궁극 패시브 효과와 자동화 능력을 해금하는 최고위 분기입니다."

upgrades:
  PickupRadius:
    name: "수집 범위"
    description: "더 넓은 범위의 코인을 모을 수 있게 됩니다."
  ToolSpeed:
    name: "도구 속도"
    description: "모든 도구의 동작 사이클을 가속합니다."
  ToolCapacity:
    name: "도구 용량"
    description: "각 도구 동작마다 이동 및 회수할 수 있는 코인 양을 늘립니다."
  ToolRange:
    name: "도구 사거리"
    description: "더 먼 위치에서 깊은 곳의 코인까지 닿을 수 있게 됩니다."
  DepositSpeed:
    name: "입금 속도"
    description: "운반 중인 코인을 금고에 넣는 속도를 높입니다."
  MovementSpeed:
    name: "이동 속도"
    description: "금고 안을 더 빠르게 이동할 수 있게 됩니다."
  CarryCapacity:
    name: "소지 용량"
    description: "주머니 및 모든 소지 가방의 코인 보관 용량을 늘립니다."

items:
  Shovel:
    name: "삽"
    description: "좌클릭을 유지하여 밀집된 코인을 근거리에서 퍼 올립니다."
  Pouch:
    name: "파우치"
    description: "소지 용량 +500, 기본 입금 속도 3배 증가. 더 오래 탐색하고 빠르게 비우세요."
  TinyMagnet:
    name: "소형 자석"
    description: "클릭하여 빠르게 12개의 코인을 당깁니다. 길게 눌러 연속 흡인이 가능합니다."
  CoinRake:
    name: "코인 갈퀴"
    description: "좌클릭을 누른 채 걸어가며 코인을 긁어모읍니다. 이동 중 최대 16개 회수."
  SpringBoots:
    name: "스프링 부츠"
    description: "점프력이 65% 증가합니다. 패시브 장비로 연료나 슬롯이 필요 없습니다."
  MagneticBoots:
    name: "마그네틱 부츠"
    description: "코인 위를 걷기만 해도 0.5초마다 주변 코인을 최대 6개 자동 회수합니다."
  Magnet:
    name: "강력 자석"
    description: "좌클릭을 유지하여 원거리에서 표면의 코인을 강력하게 끌어당깁니다."
  Backpack:
    name: "백팩"
    description: "소지 용량 +3,250. 파우치와 합쳐 총 4,000개까지 소지할 수 있습니다."
  QuickDump:
    name: "고속 배출 라이너"
    description: "모든 호퍼에서의 기본 입금 속도가 8배 빨라집니다."
  SprintSoles:
    name: "로켓 밑창"
    description: "이동 속도가 25% 증가합니다. 금고 왕복 시간을 대폭 단축합니다."
  RecallCoil:
    name: "웜홀 코일"
    description: "우클릭으로 전개 중인 진공 수류탄을 벽 너머에서도 즉시 손으로 회수합니다."
  Singularity:
    name: "특이점"
    description: "초당 3,000개의 회수 속도와 5m 광역 흡인. 흩어진 마지막 코인까지 빨아들입니다."
  Vortex:
    name: "골드 윈치"
    description: "좌클릭으로 광맥에 와이어를 사출하고 길게 눌러 코인을 단숨에 감아올립니다."
  GravityCoupler:
    name: "중력 커플러"
    description: "기본 입금 속도가 600배 빨라집니다. 어느 호퍼에서든 눈 깜짝할 사이에 입금 완료."
  CoinRailgun:
    name: "코인 레일건"
    description: "클릭 또는 길게 눌러 0.45초마다 일직선상으로 90개의 코인을 꿰뚫어 회수합니다."
  HydraulicCoupler:
    name: "유압 커플러"
    description: "기본 입금 속도가 240배 빨라집니다. 대량의 코인도 순식간에 입금 가능합니다."
  DrillVac:
    name: "드릴 진공기"
    description: "길게 눌러 발밑의 코인을 채굴: 이동하면서 펄스당 100개를 회수합니다."
  HopperPack:
    name: "호퍼 팩"
    description: "소지 용량 +11,000. 이전 가방들과 합쳐 총 15,000개까지 소지 가능합니다."

