  '(\bHands\b)\s*[^a-zA-Z0-9\s]\s*with your upgrades': '素手 · 適用中の強化'
  '(\bShovel\b)\s*[^a-zA-Z0-9\s]\s*with your upgrades': 'シャベル · 適用中の強化'
  '(\bMagnet\b)\s*[^a-zA-Z0-9\s]\s*with your upgrades': 'マグネット · 適用中の強化'
  '(\b[a-zA-Z]+\b)\s*[^a-zA-Z0-9\s]\s*with your upgrades': '$1 · 適用中の強化'
  '[^a-zA-Z0-9\s]\s*with your upgrades': ' · 適用中の強化'
  '(\d+)\s+points?\s*·\s*Requires\s+': '$1 ポイント · 要 '
