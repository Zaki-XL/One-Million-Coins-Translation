  "30322":
    name: "ラピッドポンプ"
    description: "ポンプ間隔 -3秒."
  "30312":
    name: "全面網羅"
    description: "回収範囲 +35%. 基本リーチ +30%."
  "1226":
    name: "特急カウンター"
    description: "ポケットバンクへの荷降ろし速度が、通常の納入所の75%に達します。"
  "30511":
    name: "活線放電"
    description: "稲妻がヒットごとに回収するコイン量+50%。"
  "1107":
    name: "大容量バッグ 7"
    description: "バッグ容量 +21.5%."
  "30023":
    name: "マスターグリップ"
    description: |
      完璧なグリップを成功させるたびに、以降のグリップが強化され範囲も広がりますが、タイミングがシビアになります。
      失敗するとボーナスはリセット。
      バッグ容量の150%まで過積載可能（満杯未満から開始）。
  "30222":
    name: "支店長"
    description: |
      ポケットバンクの自動回収速度および上限レート+100%。
      有効半径: 9m → 12m。
      バッグ容量+33.11%。
  "11219":
    name: "荷降ろし準備"
    description: |
      バッグ容量 +9.32%.
      納入可能距離 +0.11m.
  "1208":
    name: "ゴールドラッシュ"
    description: |
      バッグ容量の10%以上を納入した後にバッグを空にすると発動。
      ゴールドラッシュ中は、露出・解放された納入所が自動でゴールドを吸引し、壁面シュートの回収速度が2倍になります。
  "1108":
    name: "歩く金庫"
    description: |
      バッグ容量+182.99%。
      換金速度-20%。
  "1525":
    name: "広域フィールド 3"
    description: |
      回収範囲 +12%.
      ツールの基本リーチ +15%.
  "1024":
    name: "クイッククラスプ"
    description: "グリップのスイートスポットが0.12秒早く訪れます。"
  "10119":
    name: "黄金のタッチ"
    description: |
      ツール速度 +3.9%.
      素手回収量 +8.18%.
  "1526":
    name: "蓄電チャージ"
    description: |
      ヘビーストライクおよび稲妻のクールダウン-7.84%。
      バッグ容量の10%以上を納入した後に空にすると、8秒間稲妻のクールダウンが半減します。
  "11119":
    name: "運搬用梱包"
    description: |
      バッグ容量 +18.21%.
      換金速度 +7.5%.
  "1203":
    name: "納入所改築 I"
    description: |
      換金速度 +100%.
      納入可能距離 +1.5m.
  "1018":
    name: "総動員"
    description: |
      最大フロー到達時、6体目のゴーストハンドが加わり、全員の回収速度がさらに加速します。
      {Primary}長押しで継続回収。
  "30201":
    name: "ラッシュ延長"
    description: |
      換金速度+15.61%。
      ゴールドラッシュ持続時間+5秒。
  "1224":
    name: "出張窓口"
    description: |
      ポケットバンクの吸引距離が延長。
      3m以内で{Interact}を長押しすると、通常の半分の速度でバッグから納入できます。
  "30101":
    name: "金庫ライナー"
    description: "バッグ容量 +33.11%."
  "30522":
    name: "パルス過負荷"
    description: |
      磁気パルスがバウンスごとに回収できるコイン上限を増加させます。
      （連鎖間でコイン上限共有）
  "12115":
    name: "投入口拡張"
    description: |
      換金速度 +7.05%.
      納入可能距離 +0.38m.
  "1113":
    name: "圧縮パッキング 3"
    description: |
      バッグ容量 +30%.
      換金速度 +16%.
  "1402":
    name: "ヘビーストライク"
    description: |
      回収時に確率でストライクが発動し、周囲のゴールドを追加回収します。
      シャベル使用時は発動頻度と回収コイン量がさらに増加します。
  "1127":
    name: "スムーズな荷降ろし 7"
    description: |
      バッグ容量 +9.32%.
      納入可能距離 +0.11m.
  "1012":
    name: "助けの手"
    description: |
      {Primary}長押しでゴーストハンドを召喚して回収します。
      より強力で素早いツールほど回収効率が向上し、習得済みのヘビーストライクや稲妻効果も発動可能です。
  "11015":
    name: "深層リザーブ"
    description: "バッグ容量 +79.34%."
  "1026":
    name: "リズムグリップ"
    description: |
      フロー発動中かつバッグが半分以上埋まっている場合、回収速度が25%向上。
      グリップのタイミングが合わせやすくなり、直後の通常回収への復帰も早くなります。
  "1422":
    name: "ワイドショベル 2"
    description: |
      回収範囲 +25%.
      シャベル最大半径 +0.05m.
  "12215":
    name: "一括納入"
    description: |
      バッグ容量 +6.26%.
      換金速度 +7.05%.
  "1008":
    name: "ゾーン突入"
    description: |
      フローにより回収枚数と回収範囲が増加。
      最大フロー時に回収枚数+100%、回収範囲+20%に到達します。
