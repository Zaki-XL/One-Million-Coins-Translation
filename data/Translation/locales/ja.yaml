# One Million Coins 日本語ローカライズ辞書 (YAML形式)
# 各項目に以下を設定可能:
#   enabled: true / false (false にすると英語原文で表示)
#   scale: 0.85 (文字サイズ倍率、はみ出し防止用。例: 0.85 で 85% サイズ)

meta:
  language: "ja"
  fonts: "Yu Gothic UI Bold, Yu Gothic UI, Yu Gothic, Meiryo Bold, Meiryo, Segoe UI Bold"
  name: "日本語"

branches:
  "0":
    name: "モメンタム"
    description: "あらゆるツールで勢いをつけ、作業効率を跳ね上げます。"
  "1":
    name: "バッグ"
    description: "所持容量を拡大し、歩く金庫へと成長させます。"
  "2":
    name: "換金"
    description: "金庫への入金速度を高め、一瞬で荷降ろしを完了します。"
  "3":
    name: "サルベージ"
    description: "グローブの強化、回収範囲の拡大、自動荷降ろしを支援します。"
  "4":
    name: "発掘"
    description: "すべてのツールにコインの山を粉砕する力を付与します。"
  "5":
    name: "吸引"
    description: "すべてのツールから連鎖する稲妻を放てるようにします。"
  "6":
    name: "シュート"
    description: "壁面シュートによる完全自動入金パイプを構築します。"

upgrades:
  PickupRadius:
    name: "収集範囲"
    description: "より広い範囲のコインを集められるようになります。"
  ToolSpeed:
    name: "ツール速度"
    description: "すべてのツールの動作サイクルを高速化します。"
  ToolCapacity:
    name: "ツール容量"
    description: "各ツール動作ごとに移動・回収できるコインの量を増加させます。"
  ToolRange:
    name: "ツール射程"
    description: "より離れた場所から奥深くのコインに届くようになります。"
  DepositSpeed:
    name: "換金速度"
    description: "持ち運んでいるコインを金庫へ納める速度を高速化します。"
  MovementSpeed:
    name: "移動速度"
    description: "金庫内をより素早く移動できるようになります。"
  CarryCapacity:
    name: "所持容量"
    description: "ポケットやすべての所持バッグのコイン保持容量を向上させます。"

items:
  Shovel:
    name: "シャベル"
    description: "左クリックを押し続けることで、密集したコインを近距離ですくい取ります。"
  Pouch:
    name: "ポーチ"
    description: "所持容量+500、基本換金速度が3倍になります。より長く探索し、素早く荷降ろしできます。"
  TinyMagnet:
    name: "小型マグネット"
    description: "クリックで素早く12枚のコインを引き寄せます。長押しで連続吸着が可能です。"
  CoinRake:
    name: "コインレーキ"
    description: "左クリックを押しながら歩くことでコインをかき集めます。移動中最大16枚を回収します。"
  SpringBoots:
    name: "スプリングブーツ"
    description: "ジャンプ力が65%上昇します。パッシブ装備のため燃料やスロットは不要です。"
  MagneticBoots:
    name: "マグネットブーツ"
    description: "コインの上を歩くだけで、0.5秒ごとに周囲のコインを最大6枚自動で回収します。"
  Magnet:
    name: "強力マグネット"
    description: "左クリックを押し続けることで、遠距離から表面のコインを強力に引き寄せます。"
  Backpack:
    name: "バックパック"
    description: "所持容量+3,250。ポーチと合わせると合計4,000枚まで所持可能になります。"
  QuickDump:
    name: "高速排出ライナー"
    description: "すべてのホッパーでの基本換金速度が8倍になります。"
  SprintSoles:
    name: "ロケットソール"
    description: "移動速度が25%向上します。金庫との往復時間を大幅に短縮できます。"
  RecallCoil:
    name: "ワームホールコイル"
    description: "右クリックで展開中のバキュームグレネードを壁越しでも即座に手元へ回収します。"
  Singularity:
    name: "シンギュラリティ"
    description: "毎秒3,000枚の回収速度と5mの広域吸引。散らばった最後のコインまで吸い寄せます。"
  Vortex:
    name: "ゴールドウインチ"
    description: "左クリックで鉱脈にワイヤーを射出し、長押しでコインを一気に巻き取ります。"
  GravityCoupler:
    name: "重力カプラー"
    description: "基本換金速度が600倍になります。どのホッパーでも一瞬で換金が完了します。"
  CoinRailgun:
    name: "コインレールガン"
    description: "クリックまたは長押しで、0.45秒ごとに90枚のコインを一直線に撃ち抜いて回収します。"
  HydraulicCoupler:
    name: "油圧カプラー"
    description: "基本換金速度が240倍になります。大量のコインも短時間で換金可能です。"
  DrillVac:
    name: "ドリルバキューム"
    description: "長押しで真下のコインを採掘：移動しながら1パルスあたり100枚を回収します。"
  HopperPack:
    name: "ホッパーパック"
    description: "所持容量+11,000。これまでのバッグと合わせると合計15,000枚の所持が可能です。"

