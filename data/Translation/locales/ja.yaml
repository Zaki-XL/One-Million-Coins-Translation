  '(\d+)\s+points?\s*·\s*Click node to learn': '$1 ポイント · クリックして習得'
  '(\d+)\s+points?\s*·\s*': '$1 ポイント · '
  '(\d+)\s+POINT(S)?': '$1 ポイント'
  '(\d+)\s+POINTS SPENT': '$1 ポイント消費済み'

