meta:
  language: "fr"
  display_name: "Français"

branches:
  0:
    name: "Mains"
    description: "Branche d'amélioration pour ramasser à mains nues. Améliore la prise et la zone idéale."
  1:
    name: "Pelle"
    description: "Branche d'amélioration pour pelleter les pièces. Ramassez de grandes quantités en zone."
  2:
    name: "Aimant"
    description: "Branche d'amélioration pour attirer les pièces. Attire automatiquement les pièces environnantes."
  3:
    name: "Pièces"
    description: "Branche augmentant la génération, la valeur des pièces et l'efficacité de la pompe."
  4:
    name: "Agilité"
    description: "Branche augmentant la vitesse de déplacement, l'endurance et la mobilité."
  5:
    name: "Efficacité"
    description: "Branche améliorant le rechargement, la vitesse et l'efficacité de tous les outils."
  6:
    name: "Maîtrise"
    description: "Branche suprême débloquant de puissants effets passifs et des capacités d'automatisation."

upgrades:
  PickupRadius:
    name: "Rayon de ramassage"
    description: "Permet de ramasser des pièces sur une plus grande zone."
  ToolSpeed:
    name: "Vitesse des outils"
    description: "Accélère le cycle d'utilisation de tous les outils."
  ToolCapacity:
    name: "Capacité des outils"
    description: "Augmente la quantité de pièces déplacées et ramassées par action."
  ToolRange:
    name: "Portée des outils"
    description: "Permet d'atteindre les pièces plus éloignées et plus profondes."
  DepositSpeed:
    name: "Vitesse de dépôt"
    description: "Accélère la vitesse de dépôt des pièces transportées dans le coffre."
  MovementSpeed:
    name: "Vitesse de déplacement"
    description: "Permet de vous déplacer plus rapidement dans le coffre."
  CarryCapacity:
    name: "Capacité de transport"
    description: "Augmente la capacité de transport de pièces de vos poches et sacs."

items:
  Shovel:
    name: "Pelle"
    description: "Maintenez le clic gauche pour ramasser des pièces denses à courte portée."
  Pouch:
    name: "Bourse"
    description: "Capacité +500, vitesse de dépôt de base x3. Explorez plus longtemps et déchargez plus vite."
  TinyMagnet:
    name: "Mini-aimant"
    description: "Cliquez pour attirer rapidement 12 pièces. Maintenez pour une attraction continue."
  CoinRake:
    name: "Râteau à pièces"
    description: "Maintenez le clic gauche en marchant pour ratisser les pièces. Ramasse jusqu'à 16 pièces en mouvement."
  SpringBoots:
    name: "Bottes à ressorts"
    description: "Augmente le saut de 65%. Équipement passif ne nécessitant ni carburant ni emplacement."
  MagneticBoots:
    name: "Bottes magnétiques"
    description: "Marchez simplement sur les pièces pour ramasser automatiquement jusqu'à 6 pièces toutes les 0,5 s."
  Magnet:
    name: "Aimant puissant"
    description: "Maintenez le clic gauche pour attirer puissamment les pièces de surface à distance."
  Backpack:
    name: "Sac à dos"
    description: "Capacité +3 250. Permet de transporter jusqu'à 4 000 pièces avec la bourse."
  QuickDump:
    name: "Décharge rapide"
    description: "La vitesse de dépôt de base est multipliée par 8 dans toutes les trémies."
  SprintSoles:
    name: "Semelles turbo"
    description: "Vitesse de déplacement +25%. Réduit grandement les allers-retours vers le coffre."
  RecallCoil:
    name: "Bobine de rappel"
    description: "Clic droit pour rappeler instantanément vos grenades à vide, même à travers les murs."
  Singularity:
    name: "Singularité"
    description: "3 000 pièces/seconde et aspiration sur 5 m. Aspire jusqu'à la dernière pièce éparpillée."
  Vortex:
    name: "Treuil doré"
    description: "Clic gauche pour ancrer un câble dans un filon, maintenez pour enrouler les pièces d'un coup."
  GravityCoupler:
    name: "Coupleur gravitationnel"
    description: "Vitesse de dépôt de base x600. Dépôt instantané dans n'importe quelle trémie."
  CoinRailgun:
    name: "Canon à pièces"
    description: "Cliquez ou maintenez pour transpercer et ramasser 90 pièces en ligne droite toutes les 0,45 s."
  HydraulicCoupler:
    name: "Coupleur hydraulique"
    description: "Vitesse de dépôt de base x240. Déposez d'énormes quantités de pièces en un clin d'œil."
  DrillVac:
    name: "Foreuse aspirante"
    description: "Maintenez pour forer les pièces sous vos pieds : ramasse 100 pièces par impulsion en avançant."
  HopperPack:
    name: "Pack trémie"
    description: "Capacité +11 000. Permet de transporter jusqu'à 15 000 pièces au total avec les sacs précédents."

